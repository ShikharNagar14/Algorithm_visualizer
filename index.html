<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Algorithm Visualizer | Shikhar Nagar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e1f26, #383a3f);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      padding: 50px 20px 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #00e6e6;
    }

    p {
      font-size: 1.2rem;
      color: #ccc;
    }

    .main-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
      gap: 20px;
    }

    .main-buttons a {
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: 600;
      background: #00e6e6;
      color: #1e1f26;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.3s ease-in-out;
      width: 250px;
    }

    .main-buttons a:hover {
      background: #00b3b3;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3);
    }

    footer {
      margin-top: 80px;
      font-size: 0.9rem;
      color: #888;
    }

    .creator {
      color: #00e6e6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Algorithm Visualizer</h1>
    <p>Select what you want to visualize</p>
  </header>

  <div class="main-buttons">
    <a href="sorting.html">🔁 Sorting Algorithms</a>
    <a href="searching.html">🔍 Searching Algorithms</a>
  </div>

  <footer>
    <p>Created with ❤️ by <span class="creator">Shikhar Nagar</span></p>
    <p>Explore, Learn, and Visualize the core logic of algorithms</p>
  </footer>
</body>
</html>
